<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>61Dalga | Son Dakika Trabzonspor Haberleri</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
<link rel="icon" type="image/x-icon" href="favicon.ico">

  <style>
    :root {
      --bordo: #800020;
      --bordo-koyu: #5a0017;
      --mavi: #0080FF;
      --arka-plan: #f4f6f9;
      --kart-bg: #ffffff;
      --yazi-ana: #222222;
      --yazi-gri: #666666;
      --kenarlik: #e0e0e0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--arka-plan); color: var(--yazi-ana); display: flex; flex-direction: column; min-height: 100vh; }

    header { background-color: #ffffff; border-bottom: 3px solid var(--bordo); position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .header-container { max-width: 900px; margin: 0 auto; padding: 0 15px; display: flex; justify-content: space-between; align-items: center; height: 65px; }
    .logo img { height: 100px; width: auto; display: block; }

    nav ul { display: flex; list-style: none; gap: 8px; }
    nav ul li a { display: block; padding: 8px 14px; color: var(--yazi-ana); text-decoration: none; font-weight: 600; font-size: 0.9rem; border-radius: 6px; transition: all 0.2s; }
    nav ul li a:hover, nav ul li a.active { color: var(--bordo); background-color: #f0f4f8; }

    .container { max-width: 700px; margin: 25px auto; padding: 0 15px; flex: 1; }
    
    .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: white; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--kenarlik); font-size: 0.85rem; color: var(--yazi-gri); }
    .live-badge { background-color: var(--mavi); color: white; padding: 4px 10px; border-radius: 12px; font-weight: bold; font-size: 0.75rem; }

    .news-card { background-color: var(--kart-bg); border-radius: 10px; padding: 20px; margin-bottom: 18px; border-left: 5px solid var(--bordo); border-top: 1px solid var(--kenarlik); border-right: 1px solid var(--kenarlik); border-bottom: 1px solid var(--kenarlik); box-shadow: 0 2px 8px rgba(0,0,0,0.04); transition: transform 0.2s; }
    .news-card:hover { transform: translateY(-2px); }
    .news-source { font-size: 0.75rem; color: var(--mavi); font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
    .news-title { font-size: 1.15rem; color: var(--bordo-koyu); margin-bottom: 10px; line-height: 1.4; font-weight: 700; }
    .news-summary { font-size: 0.95rem; color: #444; line-height: 1.5; margin-bottom: 15px; }
    .news-footer { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--yazi-gri); border-top: 1px solid #f0f0f0; padding-top: 12px; }
    .read-more { color: white; background-color: var(--bordo); text-decoration: none; padding: 7px 14px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; }

    .loading { text-align: center; padding: 40px; color: var(--yazi-gri); background: white; border-radius: 8px; border: 1px solid var(--kenarlik); }
    footer { background-color: #ffffff; border-top: 1px solid var(--kenarlik); text-align: center; padding: 20px; font-size: 0.85rem; color: var(--yazi-gri); margin-top: auto; }
    footer span { color: var(--bordo); font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <a href="index.html" class="logo">
        <img src="logo.png" alt="61Dalga Logo">
      </a>
      <nav>
        <ul>
          <li><a href="index.html" class="active">Ana Sayfa</a></li>
          <li><a href="sondakika.html">Son Dakika</a></li>
          <li><a href="hakkimizda.html">Hakkımızda</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="container">
    <div class="status-bar">
      <span><span class="live-badge">CANLI</span> Anlık Trabzonspor Akışı</span>
      <span id="news-count">Yükleniyor...</span>
    </div>
    <div id="news-container">
      <div class="loading">Bordo-Mavi haberler yükleniyor...</div>
    </div>
  </div>

  <footer>
    &copy; 2026 <span>61DALGA</span> - Tüm Hakkı Bordo-Mavi Sevdalılarına Aittir.
  </footer>

  <script>
    const SUPABASE_URL = 'https://jqivalawjzblztirtazo.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxaXZhbGF3anpibHp0aXJ0YXpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4MzA1NjksImV4cCI6MjEwODQwNjU2OX0.uk_Ucrjcb86WSCg1UFgrvSr9Oi00Jp7UvuCYOVdiJVs';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function formatDate(isoString) {
  if (!isoString) return '';
  const date = new Date(isoString);
  
  // Türkiye saatine göre gün, ay, yıl ve saat gösterimi
  const tarih = date.toLocaleDateString('tr-TR', {
    day: '2-digit',
    month: '2-digit',
    year: 'numeric',
    timeZone: 'Europe/Istanbul'
  });

  const saat = date.toLocaleTimeString('tr-TR', {
    hour: '2-digit',
    minute: '2-digit',
    timeZone: 'Europe/Istanbul'
  });

  return `${saat} - ${tarih}`;
}

    async function loadNews() {
      const newsContainer = document.getElementById('news-container');
      const newsCount = document.getElementById('news-count');

      const { data: articles, error } = await supabaseClient
        .from('articles')
        .select('*')
        .order('published_at', { ascending: false })
        .limit(30);

      if (error || !articles || articles.length === 0) {
        newsContainer.innerHTML = '<div class="loading">Henüz eklenmiş haber bulunamadı. Botun tarama yapması bekleniyor...</div>';
        return;
      }

      newsCount.innerText = `${articles.length} Haber`;
      newsContainer.innerHTML = '';

      articles.forEach(article => {
        const card = document.createElement('div');
        card.className = 'news-card';
        card.innerHTML = `
          <div class="news-source">${article.source || 'TRABZON BASINI'}</div>
          <h2 class="news-title">${article.rewritten_title}</h2>
          <p class="news-summary">${article.rewritten_summary}</p>
          <div class="news-footer">
            <span>📅 ${formatDate(article.published_at)}</span>
            <a href="${article.link}" target="_blank" rel="noopener noreferrer" class="read-more">Devamını Oku ➔</a>
          </div>
        `;
        newsContainer.appendChild(card);
      });
    }

    loadNews();
    setInterval(loadNews, 60000);
  </script>
</body>
</html>
